project:
  type: book
  output-dir: _book
  pre-render:
    - ../../tools/us-spelling
    - ../../tools/make-contents.py

# DRAFT: delete this block at release. Quarto reads the banner only
# from website:, and a book project does not copy it over from book:.
website:
  announcement:
    icon: info-circle
    dismissable: true
    content: >-
      **Draft.** This book is under active development, and
      chapters may change. Please use 'Report an issue' to flag
      problems.
    type: warning
    position: below-navbar

book:
  title: 'Git and GitHub for Biostatistics'
  subtitle: 'A One-Week Boot Camp for incoming graduate students'
  author: 'The rgtlab Curriculum Project'
  date: today
  date-format: 'YYYY-MM-DD'

  cover-image: images/cover.png
  favicon: images/favicon.png

  site-url: https://git-bootcamp.rgtlab.org
  repo-url: https://github.com/rgt47/git-bootcamp
  repo-branch: main
  repo-actions: [edit, issue]

  search: true
  page-navigation: true
  bread-crumbs: true
  sidebar:
    style: docked
    collapse-level: 1

  chapters:
    - half-title.qmd
    - copyright.qmd
    - index.qmd
    - contents.qmd
    - preface.qmd
    - conventions.qmd
    - 00-intro.qmd

    - part: 'Five Days'
      chapters:
        - 01-day1-setup.qmd
        - 02-day2-commits.qmd
        - 03-day3-branching.qmd
        - 04-day4-github.qmd
        - 05-day5-collaboration.qmd

    - references.qmd

  appendices:
    - credits.qmd
    - colophon.qmd

format:
  html:
    theme:
      - cosmo
      - git-bootcamp.scss
    include-after-body: nav-toggle.html
    code-annotations: hover
    code-link: true
    code-copy: hover
    code-overflow: wrap
    code-tools:
      source: repo
      toggle: false
    code-block-bg: true
    code-block-border-left: '#8f3a1a'
    highlight-style: arrow
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    tbl-cap-location: top
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true

  pdf:
    documentclass: scrbook
    classoption: [11pt]
    toc: false
    code-annotations: below
    highlight-style: arrow
    geometry:
      - paperwidth=6.5in
      - paperheight=9in
      - top=0.9in
      - bottom=0.9in
      - inner=0.9in
      - outer=0.7in
    include-in-header:
      text: |
        \usepackage{fontspec}
        \setmonofont{DejaVu Sans Mono}[Scale=0.9]
        % DRAFT: delete this line, and the matching block after the
        % cover in include-before-body, at release.
        \usepackage{eso-pic}
    include-before-body:
      text: |
        \begin{titlepage}
        \thispagestyle{empty}
        \newgeometry{margin=0pt}
        \noindent\makebox[\paperwidth]{%
          \includegraphics[width=\paperwidth,height=\paperheight,keepaspectratio]{images/cover.png}%
        }
        \restoregeometry
        \end{titlepage}
        \cleardoublepage
        % DRAFT: delete at release. eso-pic draws on every page from
        % here on, whatever the page style, so the KOMA headers and
        % page numbers are untouched and the cover stays clean.
        \AddToShipoutPictureFG{%
          \AtPageLowerLeft{\makebox[\paperwidth]{\raisebox{0.15in}{%
            \footnotesize\sffamily\color{gray}%
            Draft, \today. Content may change.}}}}

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: '#>'
    collapse: true
    fig.retina: 2
    dpi: 150
